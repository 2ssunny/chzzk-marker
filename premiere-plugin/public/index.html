<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="title">CHZZK Marker Import</div>

      <div class="toolbar">
        <button id="load" class="primary">Load marker.json</button>
        <button id="clear">Clear</button>
      </div>

      <div id="emptyHint" class="muted">Chrome 확장에서 Export JSON 한 파일을 불러오세요.</div>
      <div id="fileInfo">
        <div class="label">Project</div>
        <div id="projectTitle" class="strong"></div>
        <div class="muted small"><span id="markerCount"></span> · <span id="fileName"></span></div>
        <div id="warnings" class="warn small"></div>
      </div>

      <div class="section">Markers <span class="muted small">(click to select sync marker)</span></div>
      <div id="list" class="list"></div>

      <div class="section">SYNC</div>
      <div class="kv"><span class="label">Selected CHZZK time</span><span id="selTime" class="mono"></span></div>
      <div class="kv"><span class="label">Premiere playhead</span><span id="playhead" class="mono big"></span></div>
      <div class="kv"><span class="label">Sequence</span><span id="sequence"></span></div>
      <div class="toolbar">
        <button id="syncHere" class="primary">Sync Here</button>
        <button id="gotoSel" title="Move the playhead to the selected marker's mapped time to verify the sync">Go to selected</button>
      </div>
      <div class="kv"><span class="label">Offset</span><span id="offset" class="mono"></span></div>
      <div id="syncInfo" class="muted small mono"></div>
      <div id="syncWarn" class="warn small"></div>

      <div class="section">APPLY</div>
      <button id="apply" class="primary wide">Apply All Markers</button>
      <div id="confirm" class="confirm">
        <div id="confirmText"></div>
        <div class="toolbar">
          <button id="confirmYes" class="primary">Continue</button>
          <button id="confirmNo">Cancel</button>
        </div>
      </div>
      <div id="result" class="result mono"></div>
      <div id="status" class="status"></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
